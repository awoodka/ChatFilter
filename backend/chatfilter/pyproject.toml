[project]
name = "chatfilter"
version = "0.1.0"
description = "Twitch VOD chat conversion + filtering utilities (JSONL-first)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Local transcription for live sessions (LIVE_TRANSCRIBE_PROVIDER=local, the default).
whisper = ["faster-whisper"]

[project.scripts]
chatfilter = "chatfilter.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

